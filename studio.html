<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalQube Studio | Neo-Paint Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="studio.css">
</head>
<body class="studio-body">

    <nav class="studio-nav">
        <div class="logo">CALQUBE <span class="badge">STUDIO</span></div>
        <div class="controls-top">
            <div class="control-group">
                <label>Size</label>
                <input type="range" id="brush-size" min="1" max="100" value="5">
            </div>
            <div class="control-group">
                <label>Opacity</label>
                <input type="range" id="brush-opacity" min="1" max="100" value="100">
            </div>
            <div class="color-picker-wrapper">
                <input type="color" id="color-picker" value="#3b82f6">
            </div>
        </div>
        <div class="nav-actions">
            <button id="clear-canvas" class="btn-secondary">Clear</button>
            <button id="download-btn" class="btn-primary">Export</button>
            <a href="index.html" class="btn-back">Back to Site</a>
        </div>
    </nav>

    <aside class="tool-sidebar">
        <button class="tool-btn active" data-tool="brush" title="Brush">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l5 5"/></svg>
        </button>
        <button class="tool-btn" data-tool="eraser" title="Eraser">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 13V20Z"/><path d="M17 17L10 10"/></svg>
        </button>
        <button class="tool-btn" data-tool="line" title="Line">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/></svg>
        </button>
        <button class="tool-btn" data-tool="circle" title="Circle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
        </button>
        <button class="tool-btn" data-tool="rect" title="Rectangle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
        </button>
    </aside>

    <main class="canvas-container">
        <canvas id="main-canvas"></canvas>
    </main>

    <div class="status-bar">
        <span id="tool-status">Brush Active</span>
        <span id="save-status">Saved</span>
    </div>

    <script src="studio.js"></script>
</body>
</html>
