<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalQube Pro | Vector Synthesis Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="studio.css">
    <!-- Fabric.js for Illustrator/Figma Level Vector Control -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
</head>
<body class="studio-body">

    <nav class="studio-nav">
        <div class="logo">CALQUBE PRO EXTREME</div>
        <div class="nav-actions">
            <button id="theme-toggle" class="btn-icon" title="Toggle Light/Dark Mode">
                <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
            </button>
            <div class="divider"></div>
            <div class="align-tools">
                <button onclick="align('left')" title="Align Left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 2v20M8 6h10M8 12h7M8 18h12"/></svg></button>
                <button onclick="align('center')" title="Align Center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M7 6h10M9 12h6M6 18h12"/></svg></button>
                <button onclick="align('right')" title="Align Right"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 2v20M14 6H4M15 12H9M16 18H4"/></svg></button>
            </div>
            <div class="divider"></div>
            <button id="to-front" class="btn-secondary" title="Bring to Front">Bring Front</button>
            <button id="clear-canvas" class="btn-secondary">Clear</button>
            <button id="download-btn" class="btn-primary">Export</button>
            <a href="index.html" class="btn-back">Exit</a>
        </div>
    </nav>

    <div class="main-workspace">
        <aside class="layers-sidebar">
            <div class="sidebar-header">Layers</div>
            <div id="layers-list" class="layers-content">
                <!-- Dynamic Layers -->
            </div>
        </aside>

        <aside class="tool-sidebar">
            <button class="tool-btn active" data-tool="select" title="Select Tool (V)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
            </button>
            <button class="tool-btn" data-tool="pen" title="Free Draw (P)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
            </button>
            <button class="tool-btn" data-tool="curve" title="Bezier Curve (C)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21c3-9 15-9 18 0"/><circle cx="3" cy="21" r="2"/><circle cx="21" cy="21" r="2"/><circle cx="12" cy="12" r="2"/></svg>
            </button>
            <button class="tool-btn" data-tool="rect" title="Rectangle (R)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
            </button>
            <button class="tool-btn" data-tool="circle" title="Circle (O)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
            </button>
            <button class="tool-btn" data-tool="text" title="Text Tool (T)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
            </button>
            <button class="tool-btn" data-tool="eraser" title="Vector Eraser (E)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 13V20Z"/></svg>
            </button>
            <button class="tool-btn" id="add-image-btn" title="Attach Image (I)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </button>
            <input type="file" id="image-input" accept="image/*" hidden>
        </aside>

        <main class="studio-canvas-wrapper">
            <canvas id="main-canvas"></canvas>
        </main>

        <aside class="properties-panel">
            <div class="sidebar-header">Properties</div>
            <div class="properties-content">
                <div class="prop-group">
                    <label>Position</label>
                    <div class="prop-row">
                        <div class="prop-col"><span>X</span><input type="number" id="prop-x"></div>
                        <div class="prop-col"><span>Y</span><input type="number" id="prop-y"></div>
                    </div>
                </div>
                <div class="prop-group">
                    <label>Dimensions</label>
                    <div class="prop-row">
                        <div class="prop-col"><span>W</span><input type="number" id="prop-w"></div>
                        <div class="prop-col"><span>H</span><input type="number" id="prop-h"></div>
                    </div>
                </div>
                <div class="prop-group">
                    <label>Typography</label>
                    <select id="prop-font" class="prop-select">
                        <option value="Outfit">Outfit (Default)</option>
                        <option value="Inter">Inter</option>
                        <option value="Roboto">Roboto</option>
                        <option value="Playfair Display">Playfair Display</option>
                        <option value="Montserrat">Montserrat</option>
                        <option value="Bebas Neue">Bebas Neue</option>
                        <option value="Pacifico">Pacifico</option>
                        <option value="Dancing Script">Dancing Script</option>
                        <option value="Special Elite">Special Elite</option>
                        <option value="Monoton">Monoton</option>
                        <option value="Lobster">Lobster</option>
                        <option value="Abril Fatface">Abril Fatface</option>
                        <option value="Press Start 2P">Retro Game</option>
                        <option value="Permanent Marker">Handwritten</option>
                    </select>
                    <div class="style-row">
                        <button id="prop-bold" class="btn-style" title="Bold">B</button>
                        <button id="prop-italic" class="btn-style" title="Italic">I</button>
                        <button id="prop-underline" class="btn-style" title="Underline">U</button>
                    </div>
                    <div class="style-row">
                        <button id="text-shadow" class="btn-style-large">Shadow</button>
                        <button id="text-glow" class="btn-style-large">Glow</button>
                        <button id="text-outline" class="btn-style-large">Outline</button>
                    </div>
                </div>

                <div class="prop-group">
                    <label>Appearance</label>
                    <div class="prop-row">
                        <div class="prop-col"><span>Fill</span><input type="color" id="prop-fill"></div>
                        <div class="prop-col"><span>Opacity</span><input type="range" id="prop-opacity" min="0" max="100"></div>
                    </div>
                </div>
                <div class="prop-group">
                    <label>Stroke</label>
                    <div class="prop-row">
                        <div class="prop-col"><span>Color</span><input type="color" id="prop-stroke"></div>
                        <div class="prop-col"><span>Size</span><input type="number" id="prop-stroke-width"></div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <div class="status-bar">
        <span id="tool-status">Select Mode</span>
        <span id="save-status">Saved</span>
    </div>

    <script src="studio.js"></script>
</body>
</html>
