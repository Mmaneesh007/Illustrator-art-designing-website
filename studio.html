<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalQube Pro | Vector Synthesis Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="studio.css">
    <!-- Fabric.js for Illustrator/Figma Level Vector Control -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
</head>
<body class="studio-body">
    <header class="top-nav-suite">
        <div class="menu-bar">
            <div class="menu-item">File</div>
            <div class="menu-item">Edit</div>
            <div class="menu-item">Object</div>
            <div class="menu-item">Type</div>
            <div class="menu-item">Select</div>
            <div class="menu-item">Effect</div>
            <div class="menu-item">View</div>
            <div class="menu-item">Window</div>
            <div class="menu-item">Help</div>
            <div class="menu-spacer"></div>
            <div class="top-actions">
                <button id="theme-toggle" class="btn-icon-top" title="Toggle Theme"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
                <button id="download-btn" class="btn-top-primary">Export</button>
                <a href="index.html" class="btn-top-exit">Exit</a>
            </div>
        </div>
        <div class="control-bar" id="control-palette">
            <div class="control-group">
                <div class="control-item"><span class="ctrl-label">Fill</span><input type="color" id="ctrl-fill"></div>
                <div class="control-item"><span class="ctrl-label">Stroke</span><input type="color" id="ctrl-stroke"></div>
                <div class="control-item"><span class="ctrl-label">Size</span><input type="number" id="ctrl-stroke-width" value="0"></div>
            </div>
            <div class="control-divider"></div>
            <div id="ctrl-text-tools" class="control-group" style="display: none;">
                <select id="ctrl-font" class="ctrl-select">
                    <option value="Outfit">Outfit</option>
                    <option value="Inter">Inter</option>
                    <option value="Bebas Neue">Bebas Neue</option>
                    <option value="Pacifico">Pacifico</option>
                </select>
                <button id="ctrl-bold" class="ctrl-btn-style">B</button>
            </div>
            <div class="control-group">
                <button onclick="align('left')" class="ctrl-btn-icon" title="Align Left"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 2v20M8 6h10M8 12h7M8 18h12"/></svg></button>
                <button onclick="align('center')" class="ctrl-btn-icon" title="Align Center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M7 6h10M9 12h6M6 18h12"/></svg></button>
                <button onclick="align('right')" class="ctrl-btn-icon" title="Align Right"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 2v20M14 6H4M15 12H9M16 18H4"/></svg></button>
            </div>
            <div class="control-spacer"></div>
            <div class="status-zone">
                <span id="tool-status">SELECT MODE</span>
                <span id="save-status">Saved</span>
            </div>
        </div>
    </header>

    <div class="main-workspace">
        <aside class="layers-sidebar">
            <div class="sidebar-header">Layers</div>
            <div id="layers-list" class="layers-content">
                <!-- Dynamic Layers -->
            </div>
        </aside>

        <aside class="tool-sidebar">
            <div class="tool-grid">
                <!-- Row 1 -->
                <button class="tool-btn active" data-tool="select" title="Selection Tool (V)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></button>
                <button class="tool-btn" data-tool="direct-select" title="Direct Selection (A)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/></button>
                
                <!-- Row 2 -->
                <button class="tool-btn" data-tool="magic-wand" title="Magic Wand (Y)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4l6 6"/><path d="M18 7l-1.5-1.5L2 2l3.5 14.5L13 18l5-5z"/></button>
                <button class="tool-btn" data-tool="lasso" title="Lasso Tool (Q)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 2c-4 0-4 4-4 8s4 8 8 8 8-4 8-8-4-8-8-8z"/><path d="M15 18l6 4"/></button>
                
                <!-- Row 3 -->
                <button class="tool-btn" data-tool="pen" title="Pen Tool (P)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></button>
                <button class="tool-btn" data-tool="text" title="Type Tool (T)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></button>

                <!-- Row 4 -->
                <button class="tool-btn" data-tool="line" title="Line Tool (\)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19L19 5"/></button>
                <button class="tool-btn" data-tool="rect" title="Rectangle Tool (M)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></button>

                <!-- Row 5 -->
                <button class="tool-btn" data-tool="brush" title="Paintbrush Tool (B)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 3l3 3-10.5 10.5-4-4L18 3z"/><path d="M3 21l3.5-3.5"/></button>
                <button class="tool-btn" data-tool="pencil" title="Pencil Tool (N)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></button>

                <!-- Row 6 -->
                <button class="tool-btn" data-tool="blob" title="Blob Brush (Shift+B)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9z"/><path d="M12 8v8M8 12h8"/></button>
                <button class="tool-btn" data-tool="eraser" title="Eraser Tool (Shift+E)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 13V20Z"/></button>

                <!-- Row 7 -->
                <button class="tool-btn" data-tool="rotate" title="Rotate Tool (R)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></button>
                <button class="tool-btn" data-tool="scale" title="Scale Tool (S)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></button>

                <!-- Row 8 -->
                <button class="tool-btn" id="add-image-btn" title="Place Image">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></button>
                <button class="tool-btn" data-tool="hand" title="Hand Tool (H)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v5"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v10"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v13a7 7 0 0 0 7 7h1a7 7 0 0 0 7-7V11"/></button>
            </div>
            <input type="file" id="image-input" accept="image/*" hidden>
        </aside>

        <main class="studio-canvas-wrapper">
            <canvas id="main-canvas" width="1000" height="800"></canvas>
        </main>

        <aside class="properties-panel">
            <div class="sidebar-header">Properties</div>
            <div class="properties-content">
                <div class="prop-group">
                    <label>Position</label>
                    <div class="prop-row">
                        <div class="prop-col"><span>X</span><input type="number" id="prop-x"></div>
                        <div class="prop-col"><span>Y</span><input type="number" id="prop-y"></div>
                    </div>
                </div>
                <div class="prop-group">
                    <label>Dimensions</label>
                    <div class="prop-row">
                        <div class="prop-col"><span>W</span><input type="number" id="prop-w"></div>
                        <div class="prop-col"><span>H</span><input type="number" id="prop-h"></div>
                    </div>
                </div>
                <div class="prop-group">
                    <label>Typography</label>
                    <select id="prop-font" class="prop-select">
                        <optgroup label="Standard Fonts">
                            <option value="Arial">Arial</option>
                            <option value="Arial Black">Arial Black</option>
                            <option value="Calibri">Calibri</option>
                            <option value="Cambria">Cambria</option>
                            <option value="Candara">Candara</option>
                            <option value="Century Gothic">Century Gothic</option>
                            <option value="Comic Sans MS">Comic Sans MS</option>
                            <option value="Courier New">Courier New</option>
                            <option value="Georgia">Georgia</option>
                            <option value="Impact">Impact</option>
                            <option value="Lucida Console">Lucida Console</option>
                            <option value="Palatino Linotype">Palatino</option>
                            <option value="Tahoma">Tahoma</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Trebuchet MS">Trebuchet MS</option>
                            <option value="Verdana">Verdana</option>
                        </optgroup>
                        <optgroup label="Modern & Clean">
                            <option value="Outfit" selected>Outfit (Brand Default)</option>
                            <option value="Inter">Inter</option>
                            <option value="Roboto">Roboto</option>
                            <option value="Montserrat">Montserrat</option>
                            <option value="Lato">Lato</option>
                            <option value="Open Sans">Open Sans</option>
                            <option value="Raleway">Raleway</option>
                            <option value="Oswald">Oswald</option>
                            <option value="Ubuntu">Ubuntu</option>
                        </optgroup>
                        <optgroup label="Elegant & Serif">
                            <option value="Playfair Display">Playfair Display</option>
                            <option value="Merriweather">Merriweather</option>
                            <option value="Abril Fatface">Abril Fatface</option>
                            <option value="Cinzel">Cinzel</option>
                            <option value="Libre Baskerville">Baskerville</option>
                        </optgroup>
                        <optgroup label="Creative & Display">
                            <option value="Bebas Neue">Bebas Neue</option>
                            <option value="Pacifico">Pacifico</option>
                            <option value="Dancing Script">Dancing Script</option>
                            <option value="Lobster">Lobster</option>
                            <option value="Righteous">Righteous</option>
                            <option value="Monoton">Monoton</option>
                            <option value="Special Elite">Special Elite</option>
                            <option value="Press Start 2P">Retro Game</option>
                            <option value="Permanent Marker">Handwritten</option>
                            <option value="Orbitron">Orbitron</option>
                            <option value="Anton">Anton</option>
                            <option value="Fredoka One">Fredoka</option>
                            <option value="Righteous">Righteous</option>
                            <option value="Creepster">Creepster</option>
                            <option value="Fredericka the Great">Sketch</option>
                        </optgroup>
                    </select>
                    <div class="style-row">
                        <button id="prop-bold" class="btn-style" title="Bold">B</button>
                        <button id="prop-italic" class="btn-style" title="Italic">I</button>
                        <button id="prop-underline" class="btn-style" title="Underline">U</button>
                    </div>
                    <div class="style-row">
                        <button id="text-shadow" class="btn-style-large">Shadow</button>
                        <button id="text-glow" class="btn-style-large">Glow</button>
                        <button id="text-outline" class="btn-style-large">Outline</button>
                    </div>
                </div>

                <div class="prop-group">
                    <label>Appearance</label>
                    <div class="prop-row">
                        <div class="prop-col"><span>Fill</span><input type="color" id="prop-fill"></div>
                        <div class="prop-col"><span>Opacity</span><input type="range" id="prop-opacity" min="0" max="100"></div>
                    </div>
                </div>
                <div class="prop-group">
                    <label>Stroke</label>
                    <div class="prop-row">
                        <div class="prop-col"><span>Color</span><input type="color" id="prop-stroke"></div>
                        <div class="prop-col"><span>Size</span><input type="number" id="prop-stroke-width"></div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <div class="status-bar">
        <span id="tool-status">Select Mode</span>
        <span id="save-status">Saved</span>
    </div>

    <script src="studio.js"></script>
</body>
</html>
